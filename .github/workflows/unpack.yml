name: Unpack archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect zip
        id: detect
        run: |
          if ls *.zip >/dev/null 2>&1; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack
        if: steps.detect.outputs.has == 'true'
        run: |
          for z in *.zip; do
            unzip -o -q "$z" -d .
          done
          rm -f *.zip

      - name: Commit unpacked files
        if: steps.detect.outputs.has == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unpack Sakura-Homepage.zip" || exit 0
          git push
